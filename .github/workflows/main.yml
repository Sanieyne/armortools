name: Build ArmorTools (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repo with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Ensure all submodules (including Kha) are fetched
      run: git submodule update --init --recursive

    - name: Manually clone Kha if missing
      run: |
        if not exist armorcore\Kha (
          git clone --recursive https://github.com/Kode/Kha armorcore\Kha
        )
      shell: cmd

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.27.0'

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build ArmorPaint
      run: |
        cd armorcore
        node Kha/make armorpaint -g direct3d11 --compile
      shell: cmd

    - name: Show output folder structure
      run: dir /s /b armorcore\build\
      shell: cmd

    - name: Upload built binary (ArmorPaint)
      uses: actions/upload-artifact@v4
      with:
        name: armorpaint-windows
        path: |
          armorcore/build/windows-build/Release/*.exe

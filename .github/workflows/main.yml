name: Build ArmorTools (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.27.0'

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build ArmorPaint (example)
      run: |
        cd armorcore
        make.bat armorpaint

    - name: Upload built binaries
      uses: actions/upload-artifact@v4
      with:
        name: armorpaint-windows
        path: build/bin/
